<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F6BEB">
<title>הורדת אפליקציית קופון</title>
<meta name="description" content="אפליקציית קופון: קודי הנחה ומבצעים לחנויות בישראל. זמינה לאנדרואיד ולאייפון.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="אפליקציית קופון: קודי הנחה לחנויות בישראל">
<meta property="og:description" content="הקוד מועתק בהקשה אחת, ומשם ישר לחנות. להורדה לאנדרואיד ולאייפון.">
<meta property="og:url" content="https://shopxisrael.github.io/coupon-israel/app.html">
<meta property="og:image" content="https://shopxisrael.github.io/coupon-israel/images/early-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --b1:#3472F0; --b2:#1B4AB8; --blue:#1F57D6; --ink:#102A43; --ink-soft:#486581; }
  *{box-sizing:border-box;}
  html{background:#1B4AB8;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Heebo',sans-serif;color:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg,var(--b1) 0%,var(--b2) 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 18px;text-align:center;overflow-x:hidden;
  }
  .card{width:100%;max-width:420px;}
  .logo{display:block;width:96px;height:96px;margin:0 auto 16px;border-radius:22px;box-shadow:0 10px 28px rgba(0,0,0,.28);}
  h1{margin:0;font-size:clamp(1.9rem,8vw,2.5rem);font-weight:800;line-height:1.15;}
  .sub{margin:10px auto 22px;color:#E8EEFF;font-size:1.05rem;font-weight:500;}
  .btns{display:grid;gap:12px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800;font-size:1.1rem;padding:15px 18px;border-radius:16px;box-shadow:0 10px 26px rgba(8,30,90,.3);}
  .btn small{display:block;font-weight:500;font-size:.8rem;color:var(--ink-soft);}
  .btn.off{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1.5px dashed rgba(255,255,255,.55);cursor:default;}
  .btn.off small{color:#E8EEFF;}
  .btn svg{flex:none;width:24px;height:24px;}
  .note{margin:20px 0 0;font-size:.95rem;color:#E8EEFF;}
  .note a{color:#fff;font-weight:700;}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="images/early-logo.png" alt="לוגו קופון" width="96" height="96">
  <h1>אפליקציית קופון</h1>
  <p class="sub">קודי הנחה ומבצעים לחנויות בישראל. הקוד מועתק בהקשה אחת, ומשם ישר לחנות.</p>
  <div class="btns">
    <a class="btn off" id="playBtn" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.4a1.5 1.5 0 0 0-.6 1.2v16.8a1.5 1.5 0 0 0 .6 1.2l9.6-9.6-9.6-9.6Zm10.7 8.5 2.7-2.7-11.7-6.7 9 9.4Zm0 2.2-9 9.4 11.7-6.7-2.7-2.7Zm3.9-3.4-3 3 3 3 2.9-1.7a1.5 1.5 0 0 0 0-2.6l-2.9-1.7Z"/></svg>
      <span>Google Play<small id="playNote">בקרוב</small></span>
    </a>
    <a class="btn off" id="appStoreBtn" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.800.7 3 .7c1.300 0 2.100-1.100 2.800-2.300.9-1.300 1.300-2.500 1.300-2.600-.1 0-2.500-1-2.500-3.800ZM14.200 5.900c.6-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.7-1.100 1.800-1 2.900 1.100.1 2.200-.6 2.800-1.400Z"/></svg>
      <span>App Store<small id="appNote">בקרוב</small></span>
    </a>
  </div>
  <p class="note" id="early">רוצה לנסות לפני כולם באנדרואיד? <a href="early.html">גישה מוקדמת בהזמנה</a></p>
</main>
<script>
  // כתובות החנויות. כשהאפליקציה מתפרסמת ממלאים כאן (ובאותו אופן ב-index.html), והדף עושה את השאר.
  var CONFIG = { PLAY_STORE_URL: "", APP_STORE_URL: "" };
  function enable(id, url, noteId, text) {
    var a = document.getElementById(id);
    if (!url) return false;
    a.href = url; a.className = "btn"; a.removeAttribute("aria-disabled");
    document.getElementById(noteId).textContent = text;
    return true;
  }
  var play = enable("playBtn", CONFIG.PLAY_STORE_URL, "playNote", "להורדה לאנדרואיד");
  var apple = enable("appStoreBtn", CONFIG.APP_STORE_URL, "appNote", "להורדה לאייפון");
  if (play) document.getElementById("early").style.display = "none";
  // במכשיר ידוע ועם כתובת מוגדרת: מעבר ישיר לחנות. בכל מקרה אחר נשארים עם שני הכפתורים.
  var ua = navigator.userAgent || "";
  try {
    if (/android/i.test(ua) && CONFIG.PLAY_STORE_URL) location.replace(CONFIG.PLAY_STORE_URL);
    else if (/iphone|ipad|ipod/i.test(ua) && CONFIG.APP_STORE_URL) location.replace(CONFIG.APP_STORE_URL);
  } catch (e) {}
</script>
</body>
</html>
